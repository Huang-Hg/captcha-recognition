[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-recognition"
version = "0.1.0"
description = "Multi-source text CAPTCHA recognition with shared vision, CTC and attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.8,<5"
]

[project.scripts]
captcha-train = "captcha_recognition.training:main"
captcha-recognize = "captcha_recognition.inference:main"
captcha-evaluate = "captcha_recognition.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dense_ctc", "dense_ctc_wide", "dense_ctc_attention", "svtr_adapter", "model_checkpoints", "recognition_transforms", "multiview_decode", "validation_metrics", "group_sampling", "occlusion_augmentation"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["captcha_recognition*"]

[tool.setuptools.package-data]
"captcha_recognition.backbones" = ["LICENSE", "NOTICE"]
